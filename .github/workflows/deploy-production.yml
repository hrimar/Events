name: Deploy to Azure Production

on:
  push:
    branches: [ main ]
    paths:
      - 'Events/Events.Web/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'gosofia-prod-we-app'
  AZURE_WEBAPP_PACKAGE_PATH: './publish'
  DOTNET_VERSION: '8.0.x'
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Events/Events.Web.sln

    - name: Build application
      run: dotnet build Events/Events.Web.sln --configuration Release --no-restore

    - name: Run tests
      # --configuration Release is required here: the build step above builds Release, but
      # `dotnet test` defaults to Debug when no configuration is given. With --no-build (no
      # rebuild to fall back on), it looked for a bin/Debug/... assembly that was never
      # produced - VSTestTask reports that as the cryptic "The argument ... is invalid"
      # instead of a clear "file not found". (Testing per-project via a loop, rather than
      # against the .sln, is kept anyway - it gives clearer per-project pass/fail output.)
      run: |
        set -e
        for proj in $(find Events/Tests -name '*.Tests.csproj'); do
          echo "::group::dotnet test $proj"
          dotnet test "$proj" --no-build --configuration Release --verbosity normal
          echo "::endgroup::"
        done

    - name: Publish application
      run: dotnet publish Events/Events.Web/Events.Web.csproj --configuration Release --no-build --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Install EF Core tools
      run: dotnet tool install --global dotnet-ef --version 8.0.11

    - name: Generate migration scripts
      run: |
        echo "Generating idempotent migration scripts..."
        dotnet ef migrations script --project Events/Events.Data --startup-project Events/Events.Web --output migration.sql --idempotent
        
        if [ -s migration.sql ]; then
          echo "? Migration file generated ($(wc -c < migration.sql) bytes)"
        else
          echo "?? No pending migrations - database is up to date"
        fi
      env:
        DESIGN_TIME_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Apply database migrations
      if: hashFiles('migration.sql') != ''
      uses: azure/sql-action@v2.2
      with:
        connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        path: './migration.sql'

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Logout from Azure
      run: az logout